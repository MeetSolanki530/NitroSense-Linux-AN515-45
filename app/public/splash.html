<!doctype html>
<meta charset="utf-8">
<title>NitroSense</title>
<!--
  Shown from the moment the process starts until the main window has painted.

  Deliberately self-contained: no bundler output, no webfonts, no scripts. The
  whole point is to appear before the renderer is ready, so it must not depend
  on anything the renderer needs. Kept under a few KB so it paints on the first
  frame.
-->
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .card {
    position: absolute; inset: 0;
    display: grid; place-content: center; justify-items: center;
    gap: 18px;
    border-radius: 18px;
    /* Standalone document, so it cannot read the app's tokens. These track
       tokens.css by hand: neutral black ground, red accent. */
    background:
      radial-gradient(120% 120% at 50% 0%, #1a0c0c 0%, #08080a 55%, #050506 100%);
    border: 1px solid rgba(224, 43, 29, 0.3);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    animation: card-in 260ms ease-out both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .mark { filter: drop-shadow(0 0 20px rgba(224, 43, 29, 0.6)); }
  /* Breathing glow rather than a fade. Dropping the mark to 55% opacity read
     as the app struggling to load; a glow that swells reads as alive. */
  .mark { animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(224, 43, 29, 0.45)); }
    50%      { filter: drop-shadow(0 0 26px rgba(255, 74, 51, 0.75)); }
  }

  /* Same treatment as the in-app wordmark: weight and tracking carry it, not
     colour. The bundled Oxanium is not loaded in this standalone document, so
     this uses the system stack and leans harder on the contrast. */
  .name {
    display: flex; align-items: baseline; gap: 0.34em;
    font: 400 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-transform: uppercase;
  }
  .name b {
    font-weight: 800; letter-spacing: 0.04em;
    color: #ff4a33;
    text-shadow: 0 0 16px rgba(224, 43, 29, 0.55);
  }
  .name span {
    font-weight: 300; letter-spacing: 0.42em;
    /* Tracking adds space after the last letter; pull it back so the pair
       stays optically centred in the card. */
    margin-right: -0.42em;
    color: rgba(255, 255, 255, 0.9);
  }
  .sub {
    margin-top: -8px;
    font: 400 11px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.42);
  }

  /* Indeterminate sweep: we cannot know real progress, so do not imply it. */
  .bar {
    width: 178px; height: 2px; border-radius: 2px;
    background: rgba(224, 43, 29, 0.16);
    overflow: hidden;
  }
  .bar i {
    display: block; width: 42%; height: 100%; border-radius: 2px;
    /* Fading at both ends, so the sweep reads as light travelling along the
       track rather than a block sliding across it. */
    background: linear-gradient(90deg, transparent, #ff4a33 35%, #e02b1d 65%, transparent);
    box-shadow: 0 0 12px rgba(224, 43, 29, 0.7);
    animation: sweep 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(340%); }
  }

  @media (prefers-reduced-motion: reduce) {
    /* .mark, not .mark path: the pulse moved onto the mark itself. */
    .card, .mark, .bar i { animation: none; }
  }
</style>

<div class="card">
  <svg class="mark" viewBox="0 0 32 32" width="82" height="82" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff6a4d"/>
        <stop offset="55%" stop-color="#ff4a33"/>
        <stop offset="100%" stop-color="#c62828"/>
      </linearGradient>
    </defs>
    <path d="M6 28 L6 4 L13 4 L13 17 L20 4 L26 4 L26 28 L19 28 L19 14 L12 28 Z" fill="url(#g)"/>
  </svg>

  <div class="name"><b>NITRO</b><span>SENSE</span></div>
  <div class="sub">Connecting to hardware</div>
  <div class="bar"><i></i></div>
</div>
