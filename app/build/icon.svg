<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c2b"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c100a"/>
      <stop offset="100%" stop-color="#070504"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#plate)"/>
  <rect x="4" y="4" width="504" height="504" rx="93" fill="none"
        stroke="#ff6a00" stroke-opacity="0.28" stroke-width="7"/>

  <!-- The NitroSense "N", same path as the in-app title-bar mark, scaled from
       its 32x32 viewBox to 512 with padding. -->
  <g transform="translate(96 96) scale(10)" filter="url(#glow)">
    <path d="M6 28 L6 4 L13 4 L13 17 L20 4 L26 4 L26 28 L19 28 L19 14 L12 28 Z"
          fill="url(#mark)"/>
  </g>
</svg>
