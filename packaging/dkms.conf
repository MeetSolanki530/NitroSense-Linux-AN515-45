PACKAGE_NAME="linuwu-sense"
PACKAGE_VERSION="0.2.0"

# The Makefile puts the object under src/, so that is where the build leaves
# the module too.
BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

MAKE[0]="make KVER=$kernelver"
CLEAN="make KVER=$kernelver clean"

# Rebuild on every kernel upgrade. Without this the module is compiled once for
# whichever kernel happened to be running at install time, and silently stops
# existing the first time the distribution ships a new one.
AUTOINSTALL="yes"
