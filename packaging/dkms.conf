PACKAGE_NAME="linuwu-sense"
PACKAGE_VERSION="0.2.0"

# The Makefile puts the object under src/, so that is where the build leaves
# the module too.
BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

MAKE[0]="make KVER=$kernelver"
CLEAN="make KVER=$kernelver clean"

# Rebuild on every kernel upgrade. Without this the module is compiled once for
# whichever kernel happened to be running at install time, and silently stops
# existing the first time the distribution ships a new one.
AUTOINSTALL="yes"

# The driver is written against the platform_profile device class, which only
# exists from 6.14: on anything older, platform_profile_ops has no probe,
# profile_get or profile_set, devm_platform_profile_register does not exist,
# platform_profile_notify takes different arguments, and BACKLIGHT_POWER_ON is
# undeclared. None of that is patchable from here; it is upstream targeting
# current kernels.
#
# Declaring the floor matters for more than tidiness. Without it DKMS attempts
# the build on every installed kernel and *fails*, and because the kernel
# header package runs dkms autoinstall from its own post-install hook, that
# failure propagates: dpkg leaves linux-headers unconfigured and apt exits with
# an error. One incompatible module then breaks an unrelated Ubuntu package.
# With the floor set, DKMS *skips* those kernels instead, and nothing breaks.
BUILD_EXCLUSIVE_KERNEL_MIN="6.14"
